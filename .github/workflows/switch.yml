name: Switch build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # devkitPro's own packages: OpenGL / GLES renderers.
          - name: gzdoom-switch-opengl
            image: devkitpro/devkita64:latest
            vulkan: 'OFF'
          # Vulkan renderer, linked against the NVK driver that the
          # "Switch Vulkan driver (NVK)" workflow builds and caches.
          - name: gzdoom-switch-vulkan
            image: devkitpro/devkita64:latest
            vulkan: 'ON'
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git curl xz-utils zstd ca-certificates libbz2-dev zlib1g-dev pkg-config

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version | head -n 1
          gcc --version | head -n 1
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version | head -n 1

      - name: Read pinned Mesa commit
        id: pin
        if: matrix.vulkan == 'ON'
        run: echo "commit=$(tr -d '[:space:]' < nx/mesa-switch.commit)" >> "$GITHUB_OUTPUT"

      - name: Restore the Vulkan driver
        id: nvk
        if: matrix.vulkan == 'ON'
        uses: actions/cache/restore@v4
        with:
          path: nvk-sdk
          key: nvk-sdk-${{ steps.pin.outputs.commit }}-${{ hashFiles('nx/build-nvk.sh') }}

      - name: Install the Vulkan driver
        if: matrix.vulkan == 'ON' && steps.nvk.outputs.cache-hit == 'true'
        run: |
          cp -a nvk-sdk/. /opt/devkitpro/portlibs/switch/
          lib=/opt/devkitpro/portlibs/switch/lib/libvulkan.a
          # The driver's merge step indexes the archive with the host's ar, which skips the
          # Rust standard library objects in it. Rebuild the index with the Switch toolchain.
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib "$lib"
          ls -la "$lib"
          echo "members: $(/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar t "$lib" | wc -l)"
          echo "Rust core symbols defined: $(/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm -C --defined-only "$lib" 2>/dev/null | grep -c 'core::panicking' || true)"

      - name: No Vulkan driver yet
        if: matrix.vulkan == 'ON' && steps.nvk.outputs.cache-hit != 'true'
        run: echo "::warning::No cached NVK driver for this recipe. Run the 'Switch Vulkan driver (NVK)' workflow, then re-run this one."

      - name: Build
        if: matrix.vulkan != 'ON' || steps.nvk.outputs.cache-hit == 'true'
        env:
          HAVE_VULKAN: ${{ matrix.vulkan }}
        run: bash nx/build-switch.sh

      - uses: actions/upload-artifact@v4
        if: matrix.vulkan != 'ON' || steps.nvk.outputs.cache-hit == 'true'
        with:
          name: ${{ matrix.name }}
          path: build-switch/dist
          if-no-files-found: error
