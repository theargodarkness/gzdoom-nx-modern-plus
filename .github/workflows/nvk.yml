name: Switch Vulkan driver (NVK)

# Builds Mesa's NVK Vulkan driver for Horizon from source and caches the result
# for the Switch build. Runs when the pinned Mesa commit or the build recipe
# changes, or by hand.

on:
  push:
    paths:
      - nx/build-nvk.sh
      - nx/mesa-switch.commit
      - .github/workflows/nvk.yml
  workflow_dispatch:

concurrency:
  group: nvk-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIRV_TAG: vulkan-sdk-1.3.290.0
  SPIRV_PREFIX: /opt/spirv-tools
  CARGO_HOME: /root/.cargo
  RUSTUP_HOME: /root/.rustup

jobs:
  nvk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    steps:
      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            flex bison curl ca-certificates git xz-utils zstd \
            clang libclang-dev \
            llvm-15-dev libclang-15-dev libclang-common-15-dev \
            libclc-15-dev libllvmspirvlib-15-dev \
            python3-pip python3-setuptools python3-wheel
          pip3 install --break-system-packages --no-cache-dir meson mako pyyaml packaging

      - uses: actions/checkout@v4

      - name: Read pinned Mesa commit
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < nx/mesa-switch.commit)" >> "$GITHUB_OUTPUT"

      - name: Check out mesa-switch
        uses: actions/checkout@v4
        with:
          repository: NaGaa95/mesa-switch
          ref: ${{ steps.pin.outputs.commit }}
          path: mesa-switch

      - name: Install Switch portlibs
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed switch-pkg-config switch-zlib switch-libzstd switch-libexpat switch-libdrm_nouveau
          dkp-pacman -Ss elf || true
          dkp-pacman -S --noconfirm --needed switch-libelf || echo "no switch-libelf package"
          ls /opt/devkitpro/portlibs/switch/lib | grep -i "elf" || echo "no libelf in portlibs"

      - name: Cache SPIRV-Tools
        id: cache-spirv
        uses: actions/cache@v4
        with:
          path: ${{ env.SPIRV_PREFIX }}
          key: spirv-tools-${{ env.SPIRV_TAG }}-devkita64

      - name: Build SPIRV-Tools
        if: steps.cache-spirv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SPIRV_TAG" https://github.com/KhronosGroup/SPIRV-Tools.git /tmp/SPIRV-Tools
          git clone --depth 1 --branch "$SPIRV_TAG" https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Tools/external/spirv-headers
          cmake -S /tmp/SPIRV-Tools -B /tmp/SPIRV-Tools/build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$SPIRV_PREFIX" -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON
          cmake --build /tmp/SPIRV-Tools/build
          cmake --install /tmp/SPIRV-Tools/build

      - name: Cache Rust toolchain
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo
            /root/.rustup
          key: rust-nightly-bindgen-cbindgen-devkita64

      - name: Install Rust nightly, bindgen and cbindgen
        if: steps.cache-rust.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
          . "$CARGO_HOME/env"
          rustup component add rust-src
          rustup target add aarch64-unknown-linux-gnu
          cargo install bindgen-cli cbindgen

      - name: Build NVK
        run: bash nx/build-nvk.sh mesa-switch nvk-sdk

      - name: Save driver to cache
        uses: actions/cache/save@v4
        with:
          path: nvk-sdk
          key: nvk-sdk-${{ steps.pin.outputs.commit }}-${{ hashFiles('nx/build-nvk.sh') }}

      - uses: actions/upload-artifact@v4
        with:
          name: nvk-sdk
          path: nvk-sdk
          if-no-files-found: error

      - name: Upload Meson logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: |
            mesa-switch/builddir-native/meson-logs/
            mesa-switch/builddir-switch/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
